spring.application.name=payment-service
server.port=${PORT:9011}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Import .env file and local properties if present
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:./application-local.properties

# VNPay Configuration (loaded from .env or environment variables)
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}

jwt.secret-key=${JWT_SECRET_KEY:5c4b406804cf14ef2fea719598e07d7d7c6c15d26eea55040597cb2ab6a6d35b}

# Database Configuration
spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_service}
spring.datasource.username=${PAYMENT_DB_USERNAME:postgres}
spring.datasource.password=${PAYMENT_DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
payment.kafka.topic.payment-events=payment-events
